# BioLand-US configuration: settings only.
# Behavioural coefficients and conditional-acreage shares are NOT typed here;
# they are read from data/frozen/public/behaviour_parameters_public.csv, which
# the Stata pipeline (stata/00_run_behaviour.do) writes.

[project]
name = "BioLand-US"
currency_year = 2012

[paths]
raw = "data/raw"
restricted = "data/restricted"
interim = "data/interim"
frozen = "data/frozen"
results = "results"
figures = "results/figures"
logs = "logs"
manifests = "manifests"

[polysys]
year = 2041
biomass_price_usd_per_dry_ton = 70.0
independent_allocation_families = 3

[experiment]
offers_usd_per_acre_year = [50.0, 100.0, 200.0, 300.0]
contract_years = [5, 10]

[compensation]
rent_multipliers = [1.0, 3.3544, 6.7088, 13.4175, 20.1263]
support_balanced_multiplier = 6.7088

[land]
central_structure = "FARMLAND"
structures = ["FARMLAND", "EQUAL"]

[transmission]
implemented = "T1_POOLED"
# T2-T4 remain deferred unless defensible national formulas and weights are frozen.

[uncertainty]
bootstrap_draws = 1000
bootstrap_seed = 20260912
# 4 intensive representations x 2 land structures + acreage-weighted behaviour x 2.
implemented_structural_variants = 10
