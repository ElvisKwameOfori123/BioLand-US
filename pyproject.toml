[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioland-us"
version = "0.1.0"
description = "Reproducible implementation-layer modelling for US perennial biomass mobilization."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Elvis Kwame Ofori" }
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "geopandas>=1.0",
  "pyogrio>=0.10",
  "shapely>=2.0",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
